<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KIC Static Forms Definition</title>
  </head>
  <body>
    <!-- Netlify Form Detection Definition -->
    <form name="contact" data-netlify="true" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="bot-field" />
      <input type="hidden" name="to_email" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="country" />
      <input type="text" name="interest" />
      <input type="text" name="partnershipType" />
      <input type="text" name="investment" />
      <textarea name="message"></textarea>
      <input type="text" name="type" />
    </form>
  </body>
</html>
